/* ============================================================================
 * DW-01 :: programs
 * neuro, epee, tangent, topics, xor, bench.
 * Every figure below measures its own compute time with performance.now()
 * and prints it. If a number looks too good, it is checkable.
 * ==========================================================================*/

(() => {
  'use strict';

  const { register, opts, num, esc } = Shell;
  const rafx = () => new Promise(r => requestAnimationFrame(() => r()));
  const ms1 = v => v.toFixed(v < 10 ? 2 : v < 100 ? 1 : 0) + ' ms';

  /* ==========================================================================
   * neuro
   * ========================================================================*/

  register('neuro', {
    synopsis: 'spiking neuron and cortical network simulation',
    man:
`neuro                       the model, and the cell types it produces
neuro types                 parameter table for every published regime
neuro <TYPE>                membrane potential trace for one cell
neuro fi <TYPE>             frequency-current curve, measured
neuro net [options]         the network in the ball, plotted (--fresh for a new one)

  --n N       neuron count        (default 1000)
  --ms T      duration in ms      (default 800)
  --seed S    rng seed            (default 42)
  --pi P      inhibitory fraction (default 0.2)

TYPE is one of RS IB CH FS LTS TC RZ.

Izhikevich EM (2003), IEEE Trans Neural Netw 14(6):1569-1572.`,

    async run(c, a, stdin, out) {
      const { flags, rest } = opts(a, { value: ['n', 'ms', 'seed', 'pi', 'I'] });
      const sub = (rest[0] || '').toLowerCase();

      if (!sub)            return overview(out);
      if (sub === 'types') return typeTable(out);
      if (sub === 'net')   return network(out, flags);
      if (sub === 'fi')    return fi(out, (rest[1] || 'RS').toUpperCase());

      const T = (rest[0] || '').toUpperCase();
      if (Neuro.TYPES[T]) return cell(out, T, flags);

      throw new Error('unknown subcommand: ' + rest[0] + '\nTry: neuro types');
    },
  });

  function overview(out) {
    out.write({ html: '<span class="label">Izhikevich 2003</span>' });
    out.write('');
    out.write({ html: '<span class="b">    v′ = 0.04v² + 5v + 140 − u + I</span>' });
    out.write({ html: '<span class="b">    u′ = a(bv − u)</span>' });
    out.write('');
    out.write({ html: '<span class="dim">    if v ≥ 30 mV  then  v ← c,  u ← u + d</span>' });
    out.write('');
    out.write('Two state variables. Four parameters. v in mV, t in ms.');
    out.write('');
    out.write({ html: '<span class="dim">30 mV is the spike apex, not a threshold. This model has no fixed</span>' });
    out.write({ html: '<span class="dim">threshold: excitability falls out of the quadratic term instead.</span>' });
    out.write({ html: '<span class="dim">See /topics/neuro/threshold.</span>' });
    out.write('');
    out.write({ html: '<span class="dim">neuro types    the seven regimes<br>'
      + 'neuro RS       one cell, traced<br>'
      + 'neuro fi RS    measure its f-I curve<br>'
      + 'neuro net      the thousand in the ball, wired together</span>' });
  }

  function typeTable(out) {
    let html = '<table class="t"><tr><th>type</th><th>a</th><th>b</th><th>c</th><th>d</th><th>regime</th></tr>';
    for (const k of Object.keys(Neuro.TYPES)) {
      const p = Neuro.TYPES[k];
      html += '<tr><td class="b">' + k + '</td>'
        + '<td class="n">' + p.a.toFixed(2) + '</td>'
        + '<td class="n">' + p.b.toFixed(2) + '</td>'
        + '<td class="n">' + p.c + '</td>'
        + '<td class="n">' + p.d + '</td>'
        + '<td class="dim">' + p.name + '</td></tr>';
    }
    out.write({ html: html + '</table>' });
    out.write({ html: '<span class="dim">c is the reset potential, d the reset increment on u.</span>' });
  }

  /* ---- single cell ---------------------------------------------------------- */

  function cell(out, T, flags) {
    const p = Neuro.TYPES[T];
    const protocol = T === 'TC' ? 'rebound' : T === 'RZ' ? 'pulses' : 'step';
    const I = num(flags.I, T === 'RZ' ? 1.2 : 10);
    const duration = num(flags.ms, T === 'TC' ? 400 : 500);

    const t0 = performance.now();
    const r = Neuro.simulate(T, { ms: duration, I, onset: T === 'TC' ? 120 : 60,
                                   protocol, period: 22 });
    const compute = performance.now() - t0;

    const fig = Gfx.figure(T + ' &middot; ' + p.name, ms1(compute));
    const cv = Gfx.canvas(fig, 132);

    cv.draw((ctx, w, h) => {
      const ax = Gfx.axes(ctx, w, h, {
        xmin: 0, xmax: r.ms, ymin: -90, ymax: 40,
        xlabel: 'time (ms)', ylabel: 'v (mV)', yticks: 4, xticks: 5,
      });
      /* Resting and reset levels, for reference. */
      ax.hline(p.c, Gfx.C.ink4, [2, 3]);
      const pts = [];
      for (let t = 0; t < r.ms; t++) pts.push([t, r.trace[t]]);
      ax.line(pts, Gfx.C.a, 1.1);
      ax.label(r.ms * 0.985, p.c + 3, 'c = ' + p.c, Gfx.C.ink4, 'right');
    });

    const rate = r.spikes.length / (r.ms / 1000);
    const isi = [];
    for (let i = 1; i < r.spikes.length; i++) isi.push(r.spikes[i] - r.spikes[i - 1]);

    let stim = protocol === 'rebound'
      ? 'Held at I = −25 for 120 ms, then released to I = 0.'
      : protocol === 'pulses'
        ? 'Four-ms pulses of I = ' + I + ' every 22 ms.'
        : 'Step to I = ' + I + ' at t = 60 ms.';

    Gfx.caption(fig,
      '<b>' + r.spikes.length + ' spikes</b> in ' + r.ms + ' ms, mean rate <b>'
      + rate.toFixed(1) + ' Hz</b>'
      + (isi.length ? ', first ISI ' + isi[0] + ' ms, last ISI ' + isi[isi.length - 1] + ' ms' : '')
      + '. ' + stim + '<br>' + p.note);

    out.write({ el: fig });
  }

  /* ---- f-I curve ------------------------------------------------------------ */

  function fi(out, T) {
    if (!Neuro.TYPES[T]) throw new Error('unknown cell type: ' + T);
    const p = Neuro.TYPES[T];

    const t0 = performance.now();
    const pts = Neuro.fiCurve(T, { from: 0, to: 40, step: 0.5, ms: 1200, settle: 200 });
    const compute = performance.now() - t0;
    const rheo = Neuro.rheobase(pts);
    const maxR = Math.max(...pts.map(p2 => p2[1]), 10);
    const xmax = pts.length ? pts[pts.length - 1][0] : 40;

    const fig = Gfx.figure(T + ' &middot; frequency-current', ms1(compute));
    const cv = Gfx.canvas(fig, 132);
    cv.draw((ctx, w, h) => {
      const ax = Gfx.axes(ctx, w, h, {
        xmin: 0, xmax: xmax, ymin: 0, ymax: Math.ceil(maxR / 20) * 20,
        xlabel: 'I (injected)', ylabel: 'rate (Hz)', grid: true,
      });
      ax.line(pts, Gfx.C.a, 1.3);
      if (rheo !== null) {
        ax.vline(rheo, Gfx.C.b, [2, 3]);
        ax.label(rheo + xmax * 0.02, Math.ceil(maxR / 20) * 20 * 0.9,
                 'rheobase ' + rheo, Gfx.C.b);
      }
    });

    /* Whether the rise from rheobase is continuous or a jump is the class 1
     * versus class 2 distinction. Measuring it near onset is unreliable,
     * because the sweep steps in current and the slow region just above a
     * saddle-node is narrow, so the first non-zero sample can land well up
     * the curve. Report the shape over the first few points rather than
     * pinning a label on one sample. */
    const above = pts.filter(x => x[1] > 0);
    const firstRate = above.length ? above[0][1] : 0;
    const early = above.slice(0, 6).map(x => x[1]);
    const gradual = early.length > 2 && early[early.length - 1] > early[0] * 1.5;

    Gfx.caption(fig,
      '1.2 s of simulation per point, first 200 ms discarded as transient. '
      + 'Rheobase <b>' + (rheo === null ? 'not reached' : rheo) + '</b>'
      + (firstRate ? ', first resolved rate <b>' + firstRate.toFixed(1) + ' Hz</b>' : '') + '. '
      + (gradual
          ? 'Rate climbs continuously above rheobase, which is what a saddle-node onset looks like. '
          : '')
      + 'Nothing in the model encodes an excitability class: it follows from where the bifurcation sits.'
      + (pts.clipped
          ? '<br><span class="faint">Swept until the rate reached 200 Hz. Above that the 1 ms '
            + 'step cannot resolve the interspike interval and the curve measures quantisation '
            + 'rather than the cell.</span>'
          : ''));

    out.write({ el: fig });
  }

  /* ---- network -------------------------------------------------------------- */

  /* Plot the network in the cortex window: the last T ms of the thing that
   * is actually running, not a fresh one built to look like it. The raster
   * here and the flares in the ball are the same spikes. */
  function liveNetwork(out, live, T) {
    const h = live.history(T);
    const N = h.n, Ne = h.ne, t = h.span;
    if (t < 50) {
      out.write({ html: '<span class="dim">The ball has only run ' + t + ' ms. Give it a second.</span>' });
      return;
    }

    const fig = Gfx.figure('cortex &middot; the ball, last ' + t + ' ms', 'live');
    const cv = Gfx.canvas(fig, 190);
    out.write({ el: fig });

    /* With the wave on, order the rows by longitude around the ball so the
     * travelling wave shows as diagonal bands, the way it does in a real
     * recording with electrodes laid along the tissue. */
    const byLon = !!h.wave;
    const row = new Int32Array(N);
    if (byLon) {
      const idx = Array.from({ length: N }, (_, i) => i).sort((p, q) => h.lon[p] - h.lon[q]);
      idx.forEach((cell, rank) => { row[cell] = rank; });
    } else {
      for (let i = 0; i < N; i++) row[i] = i;
    }

    const exc = [], inh = [];
    const spikesByCell = Array.from({ length: N }, () => []);
    for (const [ts, i] of h.spikes) {
      (i < Ne ? exc : inh).push([ts, row[i]]);
      spikesByCell[i].push(ts);
    }

    cv.draw((ctx, w, hh) => {
      const ax = Gfx.axes(ctx, w, hh, {
        xmin: 0, xmax: t, ymin: 0, ymax: N,
        xlabel: 'time (ms)', ylabel: byLon ? 'neuron, by longitude' : 'neuron',
        padL: 44, yticks: 4,
      });
      Gfx.blitRaster(ctx, ax, [
        { pts: exc, rgb: Gfx.rgb(Gfx.C.a) },
        { pts: inh, rgb: Gfx.rgb(Gfx.C.b) },
      ]);
      if (!byLon) ax.hline(Ne, Gfx.C.ink4, [2, 3]);
    });

    const total = exc.length + inh.length;
    const meanRate = total / N / (t / 1000);
    const cv_ = Neuro.cvIsi(spikesByCell);
    const rhythm = Neuro.dominantRhythm(h.perMs);

    Gfx.setRight(fig, 't = ' + (h.simT / 1000).toFixed(1) + ' s');
    Gfx.caption(fig,
      '<b>' + total.toLocaleString() + ' spikes</b> from the ' + N + ' cells in the cortex window: '
      + 'the last ' + t + ' ms of the ' + (h.simT / 1000).toFixed(1) + ' s it has been running. '
      + 'Mean rate <b>' + meanRate.toFixed(1) + ' Hz</b>'
      + (cv_ ? ', ISI coefficient of variation <b>' + cv_.toFixed(2) + '</b>' : '') + '. '
      + (rhythm
          ? 'The population rate has a spectral peak at <b>' + rhythm.freq.toFixed(1)
            + ' Hz</b> (' + Neuro.band(rhythm.freq) + '), standing <b>' + rhythm.ratio.toFixed(0)
            + 'x</b> above the median of the band.'
          : 'No spectral peak clears the noise floor over this window.')
      + '<br>Red is excitatory (' + Ne + '), blue inhibitory (' + h.ni + '). '
      + 'Every flare in the ball is a dot on this plot. '
      + (byLon
          ? 'Rows are ordered by longitude around the ball, so the theta travelling wave the vault '
            + 'left in the network (' + (1000 / h.wave.period).toFixed(1)
            + ' Hz, one cycle round the ball) is the diagonal banding. '
          : '')
      + '<span class="faint">neuro net --fresh builds a new network here instead.</span>');
    Term.toBottom();
  }

  async function network(out, flags) {
    const T    = Math.max(50, Math.min(3000, Math.round(num(flags.ms, 800))));

    /* No flags means the live one. Any of --n, --seed, --pi, --fresh asks
     * for a new network built here instead. */
    const fresh = flags.fresh !== undefined || flags.n !== undefined
               || flags.seed !== undefined || flags.pi !== undefined;
    const live = !fresh && typeof window !== 'undefined'
      && window.cortexInstance && window.cortexInstance.history ? window.cortexInstance : null;
    if (live) return liveNetwork(out, live, T);

    const N    = Math.max(50, Math.min(2000, Math.round(num(flags.n, 1000))));
    const seed = Math.round(num(flags.seed, 42));
    const pi   = Math.min(0.9, Math.max(0.01, num(flags.pi, 0.2)));

    const fig = Gfx.figure('cortical network &middot; ' + N + ' cells, seed ' + seed, 'building');
    const cv = Gfx.canvas(fig, 190);
    Gfx.caption(fig, '<span class="dim">simulating…</span>');
    out.write({ el: fig });
    Term.toBottom();
    Term.busy(true);

    await rafx();

    const build0 = performance.now();
    const net = Neuro.makeNetwork({ n: N, pi, seed });
    const buildMs = performance.now() - build0;

    const Ne = net.Ne;
    const exc = [], inh = [];
    const perMs = new Int32Array(T);
    const spikesByCell = Array.from({ length: N }, () => []);

    const draw = (upto) => {
      cv.draw((ctx, w, h) => {
        const ax = Gfx.axes(ctx, w, h, {
          xmin: 0, xmax: T, ymin: 0, ymax: N,
          xlabel: 'time (ms)', ylabel: 'neuron', padL: 44, yticks: 4,
        });
        Gfx.blitRaster(ctx, ax, [
          { pts: exc, rgb: Gfx.rgb(Gfx.C.a) },
          { pts: inh, rgb: Gfx.rgb(Gfx.C.b) },
        ]);
        /* Mark the excitatory / inhibitory boundary. */
        /* Divider only. The label that used to sit here was drawn over the
         * data and the caption already says which half is which. */
        ax.hline(Ne, Gfx.C.ink4, [2, 3]);
        if (upto < T) ax.vline(upto, Gfx.C.ink3);
      });
    };

    /* Simulate in slices, yielding between them so the raster fills in and
     * the page never blocks. The slice is sized to keep each turn under a
     * frame budget rather than being a fixed guess. */
    const sim0 = performance.now();
    let t = 0;
    let slice = 25;
    while (t < T) {
      const chunkStart = performance.now();
      const end = Math.min(T, t + slice);
      for (; t < end; t++) {
        const nf = Neuro.stepNetwork(net);
        perMs[t] = nf;
        for (let k = 0; k < nf; k++) {
          const i = net.fired[k];
          (i < Ne ? exc : inh).push([t, i]);
          spikesByCell[i].push(t);
        }
      }
      const took = performance.now() - chunkStart;
      /* Aim for ~10 ms of work per turn. */
      slice = Math.max(5, Math.min(200, Math.round(slice * (took > 0 ? 10 / took : 2))));
      draw(t);
      Gfx.setRight(fig, t + ' / ' + T + ' ms');
      await rafx();
      if (Term.interrupted()) break;
    }
    const simMs = performance.now() - sim0;
    Term.busy(false);

    draw(T);

    const total = exc.length + inh.length;
    const meanRate = total / N / (t / 1000);
    const cv_ = Neuro.cvIsi(spikesByCell);

    const rhythm = Neuro.dominantRhythm(perMs.subarray(0, t));

    Gfx.setRight(fig, ms1(simMs));
    Gfx.caption(fig,
      '<b>' + total.toLocaleString() + ' spikes</b> from ' + N + ' cells over ' + t + ' ms. '
      + 'Mean rate <b>' + meanRate.toFixed(1) + ' Hz</b>'
      + (cv_ ? ', ISI coefficient of variation <b>' + cv_.toFixed(2) + '</b>' : '') + '. '
      + (rhythm
          ? 'The population rate has a spectral peak at <b>' + rhythm.freq.toFixed(1)
            + ' Hz</b> (' + Neuro.band(rhythm.freq) + '), standing <b>' + rhythm.ratio.toFixed(0)
            + 'x</b> above the median of the band.'
          : 'No spectral peak clears the noise floor over this window.')
      + '<br>Red is excitatory (' + Ne + '), blue inhibitory (' + net.Ni + '). '
      + 'Nothing in the model oscillates. The rhythm is excitation building, inhibition catching up, and the gap before it can build again.'
      + '<br><span class="faint">build ' + ms1(buildMs) + ' &middot; simulate ' + ms1(simMs)
      + ' &middot; ' + (t / simMs).toFixed(1) + 'x real time'
      + ' &middot; ' + ((N * N * 4 / 1048576)).toFixed(1) + ' MB of synapses</span>');

    Term.toBottom();
  }

  /* ==========================================================================
   * tangent
   * ========================================================================*/

  register('tangent', {
    synopsis: 'walk the topic graph',
    man:
`tangent                     wander from a random start
tangent <topic>             start somewhere specific
tangent <from> <to>         shortest path between two topics
tangent --graph             the adjacency structure
tangent --hops N            how far to wander (default 4)

Edges are real cross-references written into the topics themselves, so
every hop prints the actual reason one thing leads to the next.`,

    async run(c, a, stdin, out) {
      const { flags, rest } = opts(a, { value: ['hops'] });
      const T = Content.TOPICS;
      const ids = Object.keys(T);

      if (flags.graph) return graph(out, T, ids);
      if (rest.length >= 2) return path(out, T, rest[0], rest[1]);

      let cur = rest[0] || ids[Math.floor(Math.random() * ids.length)];
      if (!T[cur]) throw new Error('no such topic: ' + cur + '\nTry: topics');

      const hops = Math.max(1, Math.min(12, Math.round(num(flags.hops, 4))));
      const seen = new Set([cur]);

      out.write({ html: '<span class="label">tangent</span>' });
      out.write('');
      out.write({ html: '<span class="b">' + esc(T[cur].title) + '</span> '
        + '<span class="faint">' + cur + '</span>' });

      for (let i = 0; i < hops; i++) {
        const links = (T[cur].links || []).filter(l => T[l.to] && !seen.has(l.to));
        if (!links.length) break;
        const pick = links[Math.floor(Math.random() * links.length)];
        seen.add(pick.to);
        await Term.sleep(90);
        out.write({ html: '<span class="faint">  │  </span><span class="dim">'
          + esc(pick.why) + '</span>' });
        out.write({ html: '<span class="faint">  └─ </span><span class="b">'
          + esc(T[pick.to].title) + '</span> <span class="faint">' + pick.to + '</span>' });
        Term.toBottom();
        cur = pick.to;
      }

      out.write('');
      out.write({ html: '<span class="dim">cat /topics/' + T[cur].area + '/' + cur
        + '</span><span class="faint">  to read where you ended up</span>' });
    },
  });

  /* Breadth-first search. Any two of his subjects are connected, and this
   * prints the actual chain rather than claiming they are. */
  function path(out, T, from, to) {
    if (!T[from]) throw new Error('no such topic: ' + from);
    if (!T[to])   throw new Error('no such topic: ' + to);

    const prev = new Map([[from, null]]);
    const q = [from];
    while (q.length) {
      const cur = q.shift();
      if (cur === to) break;
      for (const l of (T[cur].links || [])) {
        if (!T[l.to] || prev.has(l.to)) continue;
        prev.set(l.to, { from: cur, why: l.why });
        q.push(l.to);
      }
    }
    if (!prev.has(to)) {
      out.write({ html: '<span class="err">no path from ' + esc(from) + ' to ' + esc(to) + '</span>' });
      return;
    }

    const chain = [];
    for (let n = to; n; n = prev.get(n) && prev.get(n).from) {
      const p = prev.get(n);
      chain.unshift({ id: n, why: p && p.why });
      if (!p) break;
    }

    out.write({ html: '<span class="label">' + esc(from) + ' → ' + esc(to)
      + ' &middot; ' + (chain.length - 1) + ' hops</span>' });
    out.write('');
    chain.forEach((step, i) => {
      if (step.why) out.write({ html: '<span class="faint">  │  </span><span class="dim">' + esc(step.why) + '</span>' });
      out.write({ html: (i ? '<span class="faint">  └─ </span>' : '   ')
        + '<span class="b">' + esc(T[step.id].title) + '</span> <span class="faint">' + step.id + '</span>' });
    });
  }

  function graph(out, T, ids) {
    let edges = 0;
    for (const id of ids) edges += (T[id].links || []).filter(l => T[l.to]).length;

    /* Degree, and the shortest path between every pair, so the summary
     * numbers are computed rather than stated. */
    const idx = new Map(ids.map((id, i) => [id, i]));
    const n = ids.length;
    const INF = 1e9;
    const dist = Array.from({ length: n }, () => new Int32Array(n).fill(INF));
    for (let i = 0; i < n; i++) dist[i][i] = 0;
    for (const id of ids) {
      for (const l of (T[id].links || [])) {
        if (T[l.to]) dist[idx.get(id)][idx.get(l.to)] = 1;
      }
    }
    for (let k = 0; k < n; k++) for (let i = 0; i < n; i++) {
      const dik = dist[i][k];
      if (dik === INF) continue;
      for (let j = 0; j < n; j++) if (dik + dist[k][j] < dist[i][j]) dist[i][j] = dik + dist[k][j];
    }
    let sum = 0, cnt = 0, ecc = 0;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      if (i !== j && dist[i][j] < INF) { sum += dist[i][j]; cnt++; ecc = Math.max(ecc, dist[i][j]); }
    }

    let html = '<table class="t"><tr><th>topic</th><th>area</th><th>out</th><th>leads to</th></tr>';
    for (const id of ids) {
      const t = T[id];
      const ls = (t.links || []).filter(l => T[l.to]);
      html += '<tr><td class="b">' + id + '</td>'
        + '<td class="faint">' + Content.AREAS[t.area] + '</td>'
        + '<td class="n dim">' + ls.length + '</td>'
        + '<td class="dim">' + ls.map(l => l.to).join(' ') + '</td></tr>';
    }
    out.write({ html: html + '</table>' });
    out.write({ html: '<span class="dim">' + n + ' topics, ' + edges + ' edges, mean path '
      + (sum / cnt).toFixed(2) + ' hops, diameter ' + ecc + '.</span>' });
    out.write({ html: '<span class="faint">Every pair is reachable. tangent '
      + ids[0] + ' ' + ids[ids.length - 1] + '</span>' });
  }

  register('topics', {
    synopsis: 'list everything readable',
    run(c, a, stdin, out) {
      const T = Content.TOPICS;
      const byArea = {};
      for (const id of Object.keys(T)) (byArea[T[id].area] = byArea[T[id].area] || []).push(id);
      for (const area of Object.keys(byArea).sort()) {
        out.write({ html: '<span class="label">' + esc(Content.AREAS[area] || area) + '</span>' });
        let html = '<table class="t">';
        for (const id of byArea[area]) {
          html += '<tr><td class="b">' + id + '</td><td class="dim">' + esc(T[id].title) + '</td></tr>';
        }
        out.write({ html: html + '</table>' });
      }
      out.write({ html: '<span class="dim">cat /topics/&lt;area&gt;/&lt;name&gt;, or tangent &lt;name&gt;</span>' });
    },
  });

  /* ==========================================================================
   * xor  -  a small network trained by actual backpropagation
   * ========================================================================*/

  register('xor', {
    synopsis: 'train a small network by backpropagation',
    man:
`xor [--hidden N] [--lr R] [--epochs E] [--seed S]

A 2-H-1 network with tanh hidden units and a sigmoid output, trained on
XOR by gradient descent. Real forward and backward passes. The weights
are printed at the end, so the solution it found is inspectable.`,

    async run(c, a, stdin, out) {
      const { flags } = opts(a, { value: ['hidden', 'lr', 'epochs', 'seed'] });
      const H  = Math.max(2, Math.min(16, Math.round(num(flags.hidden, 3))));
      const lr = num(flags.lr, 0.5);
      const E  = Math.max(100, Math.min(50000, Math.round(num(flags.epochs, 4000))));
      const seed = Math.round(num(flags.seed, 7));

      const rng = Sys.mulberry32(seed);
      const X = [[0, 0], [0, 1], [1, 0], [1, 1]];
      const Y = [0, 1, 1, 0];

      /* Xavier-ish init. Symmetry has to be broken or every hidden unit
       * learns the same feature and the network cannot solve XOR. */
      const s = Math.sqrt(1 / 2);
      const W1 = Array.from({ length: H }, () => [ (rng() * 2 - 1) * s, (rng() * 2 - 1) * s ]);
      const b1 = new Float64Array(H);
      const W2 = Array.from({ length: H }, () => (rng() * 2 - 1) * Math.sqrt(1 / H));
      let b2 = 0;

      const sigmoid = z => 1 / (1 + Math.exp(-z));
      const losses = [];

      const t0 = performance.now();
      for (let ep = 0; ep < E; ep++) {
        let loss = 0;
        const gW1 = Array.from({ length: H }, () => [0, 0]);
        const gb1 = new Float64Array(H);
        const gW2 = new Float64Array(H);
        let gb2 = 0;

        for (let k = 0; k < 4; k++) {
          /* forward */
          const h = new Float64Array(H);
          for (let j = 0; j < H; j++) h[j] = Math.tanh(W1[j][0] * X[k][0] + W1[j][1] * X[k][1] + b1[j]);
          let z = b2;
          for (let j = 0; j < H; j++) z += W2[j] * h[j];
          const p = sigmoid(z);

          /* binary cross entropy, clipped so log never sees zero */
          const pc = Math.min(1 - 1e-12, Math.max(1e-12, p));
          loss += -(Y[k] * Math.log(pc) + (1 - Y[k]) * Math.log(1 - pc));

          /* backward. dL/dz for BCE through a sigmoid is just (p - y). */
          const dz = p - Y[k];
          gb2 += dz;
          for (let j = 0; j < H; j++) {
            gW2[j] += dz * h[j];
            const dh = dz * W2[j] * (1 - h[j] * h[j]);   /* tanh′ = 1 - tanh² */
            gW1[j][0] += dh * X[k][0];
            gW1[j][1] += dh * X[k][1];
            gb1[j] += dh;
          }
        }

        for (let j = 0; j < H; j++) {
          W1[j][0] -= lr * gW1[j][0] / 4;
          W1[j][1] -= lr * gW1[j][1] / 4;
          b1[j]    -= lr * gb1[j] / 4;
          W2[j]    -= lr * gW2[j] / 4;
        }
        b2 -= lr * gb2 / 4;

        if (ep % Math.max(1, Math.floor(E / 240)) === 0) losses.push([ep, loss / 4]);
      }
      const took = performance.now() - t0;

      const predict = x => {
        const h = new Float64Array(H);
        for (let j = 0; j < H; j++) h[j] = Math.tanh(W1[j][0] * x[0] + W1[j][1] * x[1] + b1[j]);
        let z = b2;
        for (let j = 0; j < H; j++) z += W2[j] * h[j];
        return sigmoid(z);
      };

      const fig = Gfx.figure('xor &middot; 2-' + H + '-1, lr ' + lr, ms1(took));
      const cvs = Gfx.canvas(fig, 110);
      const maxL = Math.max(...losses.map(l => l[1]));
      cvs.draw((ctx, w, h) => {
        const ax = Gfx.axes(ctx, w, h, {
          xmin: 0, xmax: E, ymin: 0, ymax: Math.max(0.05, maxL),
          xlabel: 'epoch', ylabel: 'loss', grid: true, yticks: 3,
        });
        ax.line(losses, Gfx.C.a, 1.2);
      });

      let rows = '<table class="t"><tr><th>in</th><th>target</th><th>output</th></tr>';
      let correct = 0;
      for (let k = 0; k < 4; k++) {
        const p = predict(X[k]);
        const ok = Math.round(p) === Y[k];
        if (ok) correct++;
        rows += '<tr><td>' + X[k].join(' ') + '</td><td class="n dim">' + Y[k] + '</td>'
          + '<td class="n ' + (ok ? 'b' : 'err') + '">' + p.toFixed(4) + '</td></tr>';
      }
      rows += '</table>';

      Gfx.caption(fig, rows
        + 'Final loss <b>' + losses[losses.length - 1][1].toFixed(5) + '</b>, '
        + correct + ' of 4 correct after ' + E.toLocaleString() + ' epochs of full-batch gradient descent. '
        + 'XOR is the standard example of a problem no single linear boundary solves, which is the '
        + 'entire reason the hidden layer has to be there.');

      out.write({ el: fig });
      out.write({ html: '<span class="faint">weights: W1 '
        + W1.map(r => '[' + r.map(v => v.toFixed(2)).join(', ') + ']').join(' ')
        + '  W2 [' + Array.from(W2).map(v => v.toFixed(2)).join(', ') + ']</span>' });
    },
  });

  /* ==========================================================================
   * bench
   * ========================================================================*/

  register('bench', {
    synopsis: 'measure this machine',
    async run(c, a, stdin, out) {
      Term.busy(true);
      const results = [];

      const time = (label, detail, fn) => {
        const t0 = performance.now();
        const r = fn();
        const dt = performance.now() - t0;
        results.push({ label, detail, dt, r });
        return dt;
      };

      time('network build', '1000 cells, 1M synapses', () => Neuro.makeNetwork({ n: 1000, seed: 1 }));
      const net = results[0].r;
      time('network step', '1000 cells x 100 ms', () => {
        for (let i = 0; i < 100; i++) Neuro.stepNetwork(net);
      });
      time('single cell', 'RS, 1000 ms', () => Neuro.simulate('RS', { ms: 1000, I: 10 }));
      time('f-I sweep', '81 points x 1.2 s', () => Neuro.fiCurve('FS', { from: 0, to: 40, step: 0.5, ms: 1200 }));
      time('fs walk', 'whole tree', () => {
        let n = 0; Sys.walk(Shell.ctx.root, () => n++); return n;
      });
      time('hash', '256 KB', () => Sys.fnv1a('x'.repeat(262144)));

      await rafx();

      let html = '<table class="t"><tr><th>operation</th><th>detail</th><th>time</th></tr>';
      for (const r of results) {
        html += '<tr><td>' + r.label + '</td><td class="faint">' + r.detail + '</td>'
          + '<td class="n b">' + ms1(r.dt) + '</td></tr>';
      }
      html += '</table>';
      out.write({ html });

      const stepMs = results[1].dt / 100;
      out.write({ html: '<span class="dim">One network step is ' + (stepMs * 1000).toFixed(0)
        + ' µs, so this runs at <b>' + (1 / stepMs).toFixed(0)
        + 'x</b> real time for a thousand neurons.</span>' });
      out.write({ html: '<span class="faint">'
        + (navigator.hardwareConcurrency || '?') + ' cores &middot; dpr '
        + (window.devicePixelRatio || 1) + ' &middot; '
        + (navigator.deviceMemory ? navigator.deviceMemory + ' GB &middot; ' : '')
        + Math.round(window.innerWidth) + 'x' + Math.round(window.innerHeight) + '</span>' });
      Term.busy(false);
    },
  });

})();


/* ===== js/75-epee.js ===== */
/* ============================================================================
 * DW-01 :: epee
 *
 * A scoring apparatus with real timing.
 *
 * Epee locks out at 40 ms. Whichever tip closes first opens a 40 ms window,
 * and if the other closes inside that window the box lights both sides and
 * both fencers score. There is no right of way to fall back on, so the
 * window is the entire adjudication. Foil allows 300 ms and sabre 120 ms,
 * where priority decides instead.
 *
 * Lamps are red on the left and green on the right because that is what a
 * box actually shows. Everywhere else in this machine the data channels are
 * red and blue, but getting the apparatus wrong would be the one detail a
 * fencer notices immediately, so accuracy wins here.
 *
 * The bout is winnable, and the way you win is the point. Simple visual
 * reaction is 200 to 250 ms, which is five times the lockout, so reacting
 * to the opponent's hit is not available. What is available is reading the
 * preparation, which starts about 240 ms earlier. That is the real skill,
 * and this models it honestly: watch the measure and the preparation, and
 * you can beat it. Wait to see the hit, and you cannot.
 * ==========================================================================*/

(() => {
  'use strict';

  const LOCKOUT_MS = 40;        /* epee. foil 300, sabre 120.                */
  const PREP_MS    = 240;       /* preparation to hit, the readable window   */
  const TOUCHES    = 5;         /* a pool bout is 5 touches in 3 minutes     */
  const SHORT_RECOVERY = 420;   /* penalty for falling short, out of measure */

  Shell.register('epee', {
    synopsis: 'epee scoring apparatus with real lockout timing',
    man:
`epee [--touches N] [--lockout MS]

Press space, or tap the piste, to close your tip.

Whoever closes first opens a window of MS milliseconds. If the other closes
inside it, both score. Default is 40 ms, which is the real epee value. Try
--lockout 300 to see what foil timing does to the same bout.

You cannot react to the hit: it resolves faster than you can see it. You
can read the preparation, which begins about 240 ms earlier. That is the
whole difference between the two things, and the reason distance work looks
slow.`,

    async run(c, a, stdin, out) {
      const { flags } = Shell.opts(a, { value: ['touches', 'lockout'] });
      const lockout = Math.max(1, Math.min(600, Math.round(Shell.num(flags.lockout, LOCKOUT_MS))));
      const target  = Math.max(1, Math.min(15, Math.round(Shell.num(flags.touches, TOUCHES))));

      const fig = Gfx.figure('scoring apparatus &middot; lockout ' + lockout + ' ms',
                             'touches to ' + target);
      const ui = build(fig);
      Gfx.caption(fig,
        '<span class="dim">Press <b>space</b> or tap the piste. '
        + 'Esc to stop.</span>');
      out.write({ el: fig });
      Term.toBottom();

      const log = await bout(ui, { lockout, target });

      /* Summary, computed from what actually happened. */
      const mine = log.filter(t => t.you !== null && t.opp !== null);
      const deltas = mine.map(t => t.you - t.opp);
      const wins    = log.filter(t => t.result === 'you').length;
      const doubles = log.filter(t => t.result === 'double').length;
      const against = log.filter(t => t.result === 'opp').length;
      const shorts  = log.reduce((s, t) => s + t.shorts, 0);

      const reads = log.filter(t => t.fromPrep !== null).map(t => t.fromPrep);
      const meanRead = reads.length ? reads.reduce((s, x) => s + x, 0) / reads.length : null;

      let html = '<table class="t"><tr><th>#</th><th>result</th><th>Δ</th><th>off the preparation</th></tr>';
      log.forEach((t, i) => {
        const d = (t.you !== null && t.opp !== null)
          ? (t.you - t.opp >= 0 ? '+' : '') + Math.round(t.you - t.opp) + ' ms' : '';
        html += '<tr><td class="faint">' + (i + 1) + '</td>'
          + '<td class="' + (t.result === 'you' ? 'b' : t.result === 'double' ? 'dim' : 'faint') + '">'
          + (t.result === 'you' ? 'yours' : t.result === 'double' ? 'double, both score' : 'against you')
          + '</td>'
          + '<td class="n dim">' + d + '</td>'
          + '<td class="n faint">' + (t.fromPrep === null ? '' : Math.round(t.fromPrep) + ' ms') + '</td></tr>';
      });
      html += '</table>';
      out.write({ html });

      const parts = [];
      parts.push('<b>' + ui.score.you + ' to ' + ui.score.opp + '.</b>');
      parts.push(wins + ' clean, ' + doubles + ' double' + (doubles === 1 ? '' : 's')
        + ', ' + against + ' against you' + (shorts ? ', ' + shorts + ' short' : '') + '.');
      if (deltas.length) {
        const best = Math.min(...deltas);
        parts.push('Closest exchange <b>' + Math.round(Math.min(...deltas.map(Math.abs))) + ' ms</b>'
          + (best < -lockout ? ', and your best was ' + Math.round(-best) + ' ms clear of the window' : '') + '.');
      }
      if (meanRead !== null) {
        parts.push('You went on average <b>' + Math.round(meanRead) + ' ms</b> after the preparation showed'
          + (meanRead < PREP_MS ? ', which is inside the ' + PREP_MS + ' ms it gives you, so you were reading it rather than reacting to the hit.'
                                : ', which is later than the ' + PREP_MS + ' ms of warning, so those were reactions and the timing shows it.'));
      }
      out.write({ html: '<span class="dim">' + parts.join(' ') + '</span>' });
      out.write({ html: '<span class="faint">Lockout was ' + lockout + ' ms. '
        + 'Foil is 300 and sabre 120: epee --lockout 300 and the same bout is mostly doubles.</span>' });
      Term.toBottom();
    },
  });

  /* ---- apparatus ------------------------------------------------------------ */

  function build(fig) {
    const box = document.createElement('div');
    box.className = 'epee';
    box.innerHTML =
      '<div class="epee-box">'
      +   '<div class="epee-lamp l" data-l="left"></div>'
      +   '<div class="epee-mid">'
      +     '<div class="epee-score"><span class="you">0</span><i>:</i><span class="opp">0</span></div>'
      +     '<div class="epee-state">on guard</div>'
      +   '</div>'
      +   '<div class="epee-lamp r" data-l="right"></div>'
      + '</div>'
      + '<div class="epee-piste" tabindex="0" role="button" aria-label="close your tip">'
      +   '<div class="epee-measure"><i></i></div>'
      +   '<div class="epee-hint">press space or tap</div>'
      + '</div>';

    const cap = fig.querySelector('.fig-cap');
    if (cap) fig.insertBefore(box, cap); else fig.appendChild(box);

    return {
      box,
      lampL:   box.querySelector('.epee-lamp.l'),
      lampR:   box.querySelector('.epee-lamp.r'),
      scoreY:  box.querySelector('.epee-score .you'),
      scoreO:  box.querySelector('.epee-score .opp'),
      state:   box.querySelector('.epee-state'),
      piste:   box.querySelector('.epee-piste'),
      measure: box.querySelector('.epee-measure i'),
      hint:    box.querySelector('.epee-hint'),
      score: { you: 0, opp: 0 },
    };
  }

  const sleep = ms => new Promise(r => setTimeout(r, ms));

  /* ---- the bout ------------------------------------------------------------- */

  async function bout(ui, cfg) {
    const log = [];
    let stopped = false;

    /* One input path for both keyboard and touch. Resolves with the exact
     * moment the tip closed. */
    let pressResolve = null;
    let pressArmed = false;

    const onPress = (t) => {
      if (!pressArmed || !pressResolve) return;
      const r = pressResolve;
      pressResolve = null; pressArmed = false;
      r(t);
    };

    const onKey = (e) => {
      if (e.key === 'Escape') { stopped = true; onPress(performance.now()); return; }
      if (e.code === 'Space' || e.key === ' ' || e.key === 'Enter') {
        e.preventDefault(); e.stopPropagation();
        onPress(performance.now());
      }
    };
    const onPointer = (e) => { e.preventDefault(); onPress(performance.now()); };

    window.addEventListener('keydown', onKey, true);
    ui.piste.addEventListener('pointerdown', onPointer);

    const waitPress = () => new Promise(res => { pressResolve = res; pressArmed = true; });

    try {
      for (let n = 0; n < cfg.target && !stopped; n++) {
        const touch = await exchange(ui, cfg, waitPress, () => pressArmed = false,
                                     () => { pressArmed = true; });
        if (touch === null) { stopped = true; break; }
        log.push(touch);

        if (touch.result === 'you')    ui.score.you++;
        if (touch.result === 'opp')    ui.score.opp++;
        if (touch.result === 'double') { ui.score.you++; ui.score.opp++; }
        ui.scoreY.textContent = ui.score.you;
        ui.scoreO.textContent = ui.score.opp;

        await sleep(1100);
        ui.lampL.className = 'epee-lamp l';
        ui.lampR.className = 'epee-lamp r';
      }
    } finally {
      window.removeEventListener('keydown', onKey, true);
      ui.piste.removeEventListener('pointerdown', onPointer);
    }

    ui.state.textContent = 'halt';
    ui.hint.textContent = '';
    ui.measure.style.width = '0%';
    return log;
  }

  /* A single exchange: come to measure, opponent prepares, opponent hits,
   * and whatever you did in between gets adjudicated. */
  async function exchange(ui, cfg, waitPress, disarm, arm) {
    ui.state.textContent = 'on guard';
    ui.piste.className = 'epee-piste';
    ui.hint.textContent = 'out of measure';
    ui.measure.style.width = '0%';
    await sleep(500);

    ui.state.textContent = 'fence';

    /* Measure closes over a variable interval. Hitting before it closes is
     * short: no touch, and you are out of position for a moment. */
    const approach = 700 + Math.random() * 1200;
    const inDistanceAt = performance.now() + approach;

    /* The opponent commits somewhere after measure closes. PREP_MS before
     * the hit, the preparation becomes visible. That is the readable part. */
    const commitDelay = 260 + Math.random() * 1500;
    const oppHitAt = inDistanceAt + commitDelay;
    const prepAt   = oppHitAt - PREP_MS;

    let shorts = 0;
    let youAt = null, prepShownAt = null;
    let done = false;

    /* Drive the measure bar and the preparation cue off rAF, and record the
     * frame timestamp at which the cue was actually painted. Using the
     * scheduled time would flatter the reading stat by up to a frame. */
    const anim = () => {
      if (done) return;
      const now = performance.now();
      const frac = Math.max(0, Math.min(1, 1 - (inDistanceAt - now) / approach));
      ui.measure.style.width = (frac * 100).toFixed(1) + '%';

      if (now >= inDistanceAt && ui.piste.dataset.measure !== 'in') {
        ui.piste.dataset.measure = 'in';
        ui.hint.textContent = 'in measure';
        ui.piste.classList.add('in');
      }
      if (now >= prepAt && prepShownAt === null) {
        prepShownAt = now;
        ui.piste.classList.add('prep');
        ui.state.textContent = 'preparation';
      }
      requestAnimationFrame(anim);
    };
    requestAnimationFrame(anim);

    /* The opponent's tip closes. Record when it actually fired. */
    let oppAt = null;
    const oppTimer = setTimeout(() => { oppAt = performance.now(); }, Math.max(0, oppHitAt - performance.now()));

    /* Collect presses until one lands legally, or the opponent has hit and
     * the lockout window has closed. */
    while (true) {
      const raced = await Promise.race([
        waitPress().then(t => ({ t })),
        (async () => {
          /* Resolve shortly after the lockout window shuts. */
          const wait = Math.max(0, oppHitAt + cfg.lockout + 30 - performance.now());
          await sleep(wait);
          return { timeout: true };
        })(),
      ]);

      if (raced.timeout) break;
      const t = raced.t;

      if (t < inDistanceAt) {
        /* Short. No touch, and a moment of recovery before you can go again. */
        shorts++;
        ui.piste.classList.add('short');
        ui.hint.textContent = 'short, out of measure';
        disarm();
        await sleep(SHORT_RECOVERY);
        ui.piste.classList.remove('short');
        ui.hint.textContent = performance.now() >= inDistanceAt ? 'in measure' : 'out of measure';
        arm();
        if (oppAt !== null && performance.now() > oppAt + cfg.lockout) break;
        continue;
      }
      youAt = t;
      break;
    }

    done = true;
    clearTimeout(oppTimer);
    if (oppAt === null) oppAt = oppHitAt;   /* it was due; the timer was cut */

    /* ---- adjudication -----------------------------------------------------
     * Whoever closes first opens the window. Inside it, both score. */
    let result;
    if (youAt === null) {
      result = 'opp';
    } else {
      const delta = youAt - oppAt;
      if (Math.abs(delta) <= cfg.lockout) result = 'double';
      else if (delta < 0) result = 'you';
      else result = 'opp';
    }

    /* Light the box. Left lamp is yours, right is the opponent's. */
    if (result === 'you' || result === 'double') ui.lampL.classList.add('lit');
    if (result === 'opp' || result === 'double') ui.lampR.classList.add('lit');

    ui.state.textContent =
      result === 'double' ? 'double, ' + Math.round(Math.abs(youAt - oppAt)) + ' ms apart'
      : result === 'you'  ? 'yours, by ' + Math.round(oppAt - youAt) + ' ms'
                          : 'against you';
    ui.piste.className = 'epee-piste';
    ui.piste.dataset.measure = '';
    ui.hint.textContent = '';

    return {
      you: youAt, opp: oppAt, result, shorts,
      fromPrep: (youAt !== null && prepShownAt !== null && youAt >= prepShownAt)
        ? youAt - prepShownAt : null,
    };
  }

})();


/* ===== js/80-vault.js ===== */
/* ============================================================================
 * DW-01 :: vault
 *
 * Four locks. Each one takes real work with the tools already in the
 * machine, and none of them can be brute forced in a way that is more fun
 * than solving them.
 *
 *   trace     identify a cell type from its membrane potential alone
 *   cipher    break a Vigenere with a key the machine will tell you if
 *             you read it properly
 *   touch     land a clean touch inside the lockout window
 *   checksum  find the one file on disk whose hash matches
 *
 * The card itself is never locked. /birthday is readable from the first
 * second. The vault holds the things that are worth working for.
 * ==========================================================================*/

const Vault = (() => {
  'use strict';

  const KEY = 'dw01.vault.v1';
  const LOCKS = ['trace', 'cipher', 'touch', 'checksum'];

  let earned = new Set();

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) earned = new Set(JSON.parse(raw));
    } catch (e) { /* storage unavailable. The puzzles still work, they just
                     will not survive a reload. */ }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify([...earned])); } catch (e) {}
  }

  const has = id => earned.has(id);
  const count = () => earned.size;
  const open = () => earned.size >= LOCKS.length;

  function grant(id, out) {
    if (earned.has(id)) {
      out.write({ html: '<span class="dim">Already solved. Key held.</span>' });
      return false;
    }
    earned.add(id);
    save();
    out.write('');
    out.write({ html: '<span class="ok b">KEY ' + earned.size + ' OF ' + LOCKS.length
      + ' RECOVERED</span> <span class="dim">(' + id + ')</span>' });
    if (open()) {
      out.write('');
      out.write({ html: '<span class="b">All four. The vault is open.</span>' });
      out.write({ html: '<span class="dim">cat /vault/notes</span>' });
      mountVault();
      /* Every cell driven at once. The network genuinely synchronises,
       * which is what a seizure is, and briefly it is the best looking
       * thing this machine does. */
      if (window.cortexInstance && window.cortexInstance.pulse) {
        window.cortexInstance.pulse(38, 900);
        /* And it stays changed. From here on the network carries a theta
         * travelling wave, which is the ball telling you the vault is open
         * every time you look at it. */
        if (window.cortexInstance.entrain) window.cortexInstance.entrain();
        out.write({ html: '<span class="dim">Look at the ball.</span>' });
      }
    } else {
      out.write({ html: '<span class="dim">' + (LOCKS.length - earned.size)
        + ' to go. <span class="b">vault</span> for what is left.</span>' });
    }
    return true;
  }

  /* ---- vigenere -------------------------------------------------------------- */

  function vigenere(text, key, decrypt) {
    const k = key.toUpperCase().replace(/[^A-Z]/g, '');
    if (!k) return text;
    let out = '', ki = 0;
    for (const ch of text) {
      const c = ch.toUpperCase();
      if (c >= 'A' && c <= 'Z') {
        const shift = k.charCodeAt(ki % k.length) - 65;
        const base = c.charCodeAt(0) - 65;
        const v = decrypt ? (base - shift + 26) % 26 : (base + shift) % 26;
        const res = String.fromCharCode(65 + v);
        out += ch === c ? res : res.toLowerCase();
        ki++;
      } else out += ch;
    }
    return out;
  }

  /* The plaintext, and the key it is encrypted under. The key is EPEE,
   * which the machine will hand over to anyone who reads the clue and knows
   * which weapon has no right of way. */
  const CIPHER_KEY = 'EPEE';
  const CIPHER_PLAIN =
`You went looking for the key instead of waiting to be given it.
That is the entire personality trait, and it is a good one.`;

  const CIPHER_TEXT = vigenere(CIPHER_PLAIN, CIPHER_KEY, false);

  /* ---- vault contents -------------------------------------------------------- */

  const NOTES =
`What I have actually learned from you
-------------------------------------

I want to be specific here, because vague praise is worth nothing and you
would spot it immediately.

One. That the interesting question is almost never the one being asked.
You reliably reframe things, and about a third of the time the reframe is
better than the original question. I have started doing it on purpose
because of you.

Two. That depth is not the same as difficulty. You go deep on things that
are genuinely fun to go deep on, and you never once made it feel like
homework. Most people who know a lot make other people feel small with it.
You do the opposite. You hand it over.

Three. That being interested in everything is a real strategy and not a
failure to focus. You connect food to chemistry to history to economics
because they actually connect, and the people who told you to pick a lane
were describing their own limits, not yours.

Four. Patience, from watching you train. You do not get bored of something
just because it is not finished yet.


A thing I am not going to be subtle about
-----------------------------------------

You are easy to be around and you are worth the time. I do not think you
hear that enough, and I think you should hear it on your birthday from

The year ahead
--------------

I hope you eat something this year that reorganises your idea of what food

And I hope you keep going on the tangents. Please do not learn to get to

Happy birthday, Max.

    run(c, a, stdin, out) {
      const guess = (a[0] || '').toUpperCase();

      if (!guess) {
        const pool = ['RS', 'IB', 'CH', 'FS', 'LTS'];
        const pick = pool[Math.floor(Math.random() * pool.length)];
        const I = 8 + Math.floor(Math.random() * 6);

        const dt = performance.now() - t0;

        const fig = Gfx.figure('unknown cell &middot; I = ' + I, dt.toFixed(2) + ' ms');

        cv.draw((ctx, w, h) => {
          const ax = Gfx.axes(ctx, w, h, {
            xmin: 0, xmax: r.ms, ymin: -90, ymax: 40,

          const pts = [];
          for (let i = 0; i < r.ms; i++) pts.push([i, r.trace[i]]);
          ax.line(pts, Gfx.C.a, 1.1);
        });

        const isi = [];
        for (let i = 1; i < r.spikes.length; i++) isi.push(r.spikes[i] - r.spikes[i - 1]);

        out.write({ el: fig });

      if (!pending) throw new Error('no trace on screen. run `identify` first');
      if (!Neuro.TYPES[guess]) throw new Error('not a cell type: ' + guess + '. try `neuro types`');

      if (guess === pending.type) {
        out.write({ html: '<span class="ok b">' + guess + '. Correct.</span> <span class="dim">'

        pending = null;
        Vault.grant('trace', out);
      } else {
        const p = Neuro.TYPES[pending.type];
        out.write({ html: '<span class="err">Not ' + guess + '.</span> <span class="dim">'
          + (guess === 'FS' || guess === 'LTS'

  /* ---- cipher --------------------------------------------------------------- */

  register('decode', {
    synopsis: 'break the Vigenere in /vault/sealed',
    man: 'decode <key>\n\nVigenere. The key is four letters.',
    run(c, a, stdin, out) {
      const key = (a[0] || '').replace(/[^A-Za-z]/g, '');
      if (!key) throw new Error('usage: decode <key>');

      const f = Sys.resolve(Shell.ctx.root, '/', '/vault/sealed');
      if (!f) throw new Error('/vault/sealed: not found');

      const plain = Vault.vigenere(f.content, key, true);
      const looksRight = /\b(THE|THAT|YOU|AND|IS|IT)\b/i.test(plain);

      out.write({ html: '<span class="label">key ' + esc(key.toUpperCase()) + '</span>' });
      out.write('');
      for (const l of plain.replace(/\n$/, '').split('\n')) {
        out.write({ html: looksRight ? esc(l) : '<span class="faint">' + esc(l) + '</span>' });
      }
      out.write('');

      if (looksRight) Vault.grant('cipher', out);
      else out.write({ html: '<span class="dim">Still noise, so that is not the key. '
        + 'Four letters. The weapon where the whole body is target and nobody has priority.</span>' });
    },
  });

  /* ---- checksum ------------------------------------------------------------- */

  register('claim', {
    synopsis: 'claim the file matching the vault checksum',
    man: 'claim <path>\n\nThe hash is fnv1a, 32 bit, over the file contents.\nYou have cksum and find.',
    run(c, a, stdin, out) {
      const p = a[0];
      if (!p) throw new Error('usage: claim <path>');
      const n = Sys.resolve(Shell.ctx.root, Shell.ctx.cwd, p);
      if (!n) throw new Error(p + ': no such file or directory');
      if (n.type !== 'file') throw new Error(p + ': not a file');

      const sum = Sys.hex8(Sys.fnv1a(n.content));
      out.write({ html: '<span class="dim">' + esc(p) + '</span>  ' + sum
        + (sum === Vault.target ? ' <span class="ok">match</span>' : ' <span class="err">no match</span>') });

      if (sum === Vault.target) Vault.grant('checksum', out);
      else out.write({ html: '<span class="faint">Looking for ' + Vault.target
        + '. Try: find / -type f | head -40, then cksum on the likely ones.</span>' });
    },
  });
})();

/* ============================================================================
 * DW-01 :: sigma
 *
 * The hard one. Undocumented: it is absent from `help`, absent from the
 * command list, and the only way in is `ls -a`, which the ls man page does
 * mention for anyone who reads it.
 *
 * The problem itself is a real derivation, not a riddle.
 *
 * At equilibrium the recovery variable satisfies u = bv, so the v nullcline
 * becomes
 *
 *     0.04v² + (5 − b)v + (140 + I) = 0
 *
 * That quadratic has two roots: a stable rest state and an unstable saddle.
 * The cell stays quiescent while both exist. As I rises they approach each
 * other and annihilate in a saddle-node bifurcation, and the cell begins to
 * fire at precisely the current where the discriminant vanishes:
 *
 *     (5 − b)² − 0.16(140 + I) = 0
 *     I*(b) = 25(5 − b)²/4 − 140
 *
 * The pleasing part, and the reason this is the puzzle, is that the ugly
 * decimals collapse to exact rationals:
 *
 *     b = 1/5  →  I* = 25(24/5)²/4 − 140 = 144 − 140 = 4
 *     b = 1/4  →  I* = 25(19/4)²/4 − 140 = 9025/64 − 8960/64 = 65/64
 *
 * Nothing about 0.04, 5 and 140 promises an integer at the standard
 * parameters, and it is not a coincidence anyone can see coming. The answer
 * cannot be guessed and cannot be reached by measuring, because `neuro fi`
 * only steps in halves. It has to be derived.
 * ==========================================================================*/

(() => {
  'use strict';

  const KEY = 'dw01.sigma.v1';

  const PROBLEM =
`Σ
─

Undocumented. You found it, so it is yours.

The Izhikevich model has no threshold parameter. Whether a cell fires is
decided by the geometry of its nullclines, so the current at which a
quiescent cell first begins to fire is derivable rather than measured.

  v′ = 0.04v² + 5v + 140 − u + I
  u′ = a(bv − u)

Find I*(b), the exact current at which a cell with parameter b stops being
quiescent. Then evaluate it at b = 1/4.

The answer is rational. Give it exactly.

  sigma <answer>

Read this part before you start, because it will save you an hour and it
is the only warning you get.

Answer for the continuous system, not for this machine. They disagree.
The integrator here is explicit Euler at half-millisecond steps, and near
a saddle-node a quadratic overshoots the separatrix, so the discrete map
crosses at a current the flow would have returned from. At the standard
b = 1/5 the exact answer is a whole number and \`neuro fi\` measures about
3.78. That gap is discretisation error, not a wrong answer, and if you try
to solve this by measuring you will converge confidently on the wrong
number.

The whole number at b = 1/5 is the hint. Nothing about 0.04, 5 and 140 has
any business producing one.
`;

  /* 65/64 exactly. Compared as a rational so 1.015625 and 65/64 and
   * 130/128 all pass, and 1.0156 does not. */
  const NUM = 65, DEN = 64;

  function parseExact(s) {
    const t = String(s).trim().replace(/\s+/g, '');
    let m = t.match(/^(-?\d+)\/(\d+)$/);
    if (m) return { n: parseInt(m[1], 10), d: parseInt(m[2], 10) };
    m = t.match(/^-?\d+(\.\d+)?$/);
    if (m) {
      const dec = (t.split('.')[1] || '').length;
      const d = Math.pow(10, dec);
      return { n: Math.round(parseFloat(t) * d), d };
    }
    return null;
  }

  const solved = () => {
    try { return localStorage.getItem(KEY) === '1'; } catch (e) { return false; }
  };
  const markSolved = () => {
    try { localStorage.setItem(KEY, '1'); } catch (e) {}
  };

  /* Dylan has not written this one yet. Until he does, the file says so
   * plainly rather than carrying a bracketed note to him, because the only
   * person who reaches it has done real work to get here. */
  const PAYOFF_PLACEHOLDER =
`You found it. 65/64.

Dylan owes you a note in this file. Ask him for it.
`;

  function mount() {
    const root = Shell.ctx.root;
    if (root.children['.sigma']) return;
    const f = Sys.file('.sigma', PROBLEM);
    f.parent = root;
    root.children['.sigma'] = f;

    if (solved()) reveal();
  }

  function reveal() {
    const root = Shell.ctx.root;
    if (root.children['.solved']) return;
    const f = Sys.file('.solved', PAYOFF_PLACEHOLDER);
    f.parent = root;
    root.children['.solved'] = f;
  }

  /* Deliberately not in the help groups. */
  Shell.register('sigma', {
    synopsis: 'Σ',
    hidden: true,
    run(c, a, stdin, out) {
      if (!a.length) {
        if (solved()) {
          out.write({ html: '<span class="ok b">Σ solved.</span> <span class="dim">cat /.solved</span>' });
          return;
        }
        for (const l of PROBLEM.replace(/\n$/, '').split('\n')) out.write(l);
        return;
      }

      const got = parseExact(a.join(''));
      if (!got) throw new Error('give a number. a fraction like 3/8, or a decimal.');

      /* Cross multiply rather than compare floats. */
      const exact = got.n * DEN === NUM * got.d;

      if (!exact) {
        const val = got.n / got.d;
        const close = Math.abs(val - NUM / DEN) < 0.02 && val !== NUM / DEN;
        out.write({ html: '<span class="err">No.</span> <span class="dim">'
          + (close
              ? 'Close enough that you have the right derivation and the wrong arithmetic. It is exact, and the denominator is a power of two.'
              : 'Set u = bv, ask when the two equilibria collide, and solve for I.')
          + '</span>' });
        return;
      }

      markSolved();
      reveal();

      out.write('');
      out.write({ html: '<span class="ok b">65/64.</span>' });
      out.write('');
      out.write({ html: '<span class="dim">Set u = bv, and the v nullcline is '
        + '0.04v² + (5 − b)v + (140 + I) = 0. Two equilibria, a rest state and a saddle. '
        + 'They annihilate where the discriminant vanishes:</span>' });
      out.write('');
      out.write({ html: '<span class="b">    I*(b) = 25(5 − b)²/4 − 140</span>' });
      out.write('');
      out.write({ html: '<span class="dim">At b = 1/4 that is 9025/64 − 8960/64 = 65/64. '
        + 'At b = 1/5 it is 576/4 − 140 = 4, exactly.</span>' });
      out.write({ html: '<span class="dim">An integer out of 0.04, 5 and 140, at the parameters '
        + 'everyone actually uses. Izhikevich never mentions it.</span>' });
      out.write('');
      out.write({ html: '<span class="faint">And the 3.78 this machine measures is the Euler step, '
        + 'not the model. The flow and the map do not share a threshold.</span>' });
      out.write('');
      out.write({ html: '<span class="b">There is one more file.</span> <span class="dim">cat /.solved</span>' });

      if (window.cortexInstance && window.cortexInstance.pulse) {
        window.cortexInstance.pulse(42, 1400);
      }
    },
  });

  window.SigmaMount = mount;
})();

/* ============================================================================
 * DW-01 :: main
 *
 * Boots the desktop, opens the two windows, wires the shell, and runs the
 * startup checks.
 *
 * The boot sequence prints no fake progress. Every line is a real check and
 * every number on it is computed at that moment: the filesystem is walked,
 * the content is hashed, the integrator is run against a known result, and
 * every edge in the topic graph is resolved. Change one byte of content and
 * the checksum on screen changes.
 * ==========================================================================*/

const Main = (() => {
  'use strict';

  const VERSION = '1.0';
  const KEY = 'dw01.state.v1';

  let state = { visits: 0, first: null, last: null };
  let termWin = null, cortexWin = null;

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) state = Object.assign(state, JSON.parse(raw));
    } catch (e) { /* private mode. Not worth failing over. */ }
    state.visits++;
    state.first = state.first || Date.now();
    const prev = state.last;
    state.last = Date.now();
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    return prev;
  }

  function updatePrompt() {
    Term.setPrompt('<span class="cwd">' + Shell.ctx.cwd + '</span><span class="sig"> $ </span>');
  }

  /* ---- windows -------------------------------------------------------------- */

  function terminalBody() {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:absolute;inset:0';
    wrap.innerHTML =
      '<div id="screen">'
      + '<div id="out"></div>'
      + '<div id="promptline">'
      +   '<span id="ps1"></span>'
      +   '<span id="inputwrap">'
      +     '<span id="echo"></span>'
      +     '<textarea id="input" rows="1" autocapitalize="none" autocorrect="off"'
      +       ' autocomplete="off" spellcheck="false" aria-label="command line"></textarea>'
      +   '</span>'
      + '</div>'
      + '</div>';
    return wrap;
  }

  /* No black backdrop. The ball sits on the same dark panel as the shell,
   * so its silhouette is a crisp edge against grey rather than black lost
   * in black. */
  function cortexBody() {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:absolute;inset:0';
    return wrap;
  }

  function layout() {
    const W = window.innerWidth, H = window.innerHeight;
    if (WM.isTouch) {
      /* Budget the viewport explicitly. Stacked windows are in normal flow
       * with flex:0 0 auto, so anything without a height shrink-wraps its
       * content, which collapsed the terminal to two visible lines. */
      const pad = 12, gap = 12, keybar = 46;
      const ch = Math.min(300, Math.round(H * 0.33));
      const th = Math.max(340, H - ch - keybar - pad * 2 - gap);
      return {
        cortex: { x: 0, y: 0, w: 0, h: ch },
        term:   { x: 0, y: 0, w: 0, h: th },
      };
    }
    const pad = 26, gap = 18;
    const avail = W - pad * 2 - gap;
    const cw = Math.max(280, Math.min(400, Math.round(avail * 0.31)));
    const tw = Math.max(400, avail - cw);
    const h  = Math.max(360, Math.min(700, H - pad * 2));
    const ch = Math.min(h, cw + 118);

    /* Centre the pair vertically rather than pinning to the top, which left
     * a band of dead space under both windows on a short viewport. Each is
     * centred on its own height so they read as a balanced pair. */
    const ty = Math.max(pad, Math.round((H - h) / 2));
    const cy = Math.max(pad, Math.round((H - ch) / 2));
    return {
      term:   { x: pad, y: ty, w: tw, h },
      cortex: { x: pad + tw + gap, y: cy, w: cw, h: ch },
    };
  }

  function openWindows() {
    const L = layout();

    /* On a phone the sphere goes first: it is the thing worth seeing before
     * anything is read. On a desktop they sit side by side. */
    const order = WM.isTouch ? ['cortex', 'term'] : ['term', 'cortex'];

    /* The sphere mounts into this wrap, not into win.body. The wrap is
     * position:absolute with a black background, and WM.create puts it
     * inside win.body, so a canvas appended to win.body lands as a static
     * sibling *underneath* it: positioned boxes paint above in-flow ones.
     * That was a fully working simulation drawing into a canvas that a
     * black div covered, and readPixels was the only thing that could see
     * it. */
    const cortexWrap = cortexBody();

    const make = {
      term: () => WM.create({
        id: 'term',
        title: '<b>dw-01</b> &nbsp;&middot;&nbsp; shell',
        x: L.term.x, y: L.term.y, w: L.term.w, h: L.term.h,
        closable: false,
        body: terminalBody(),
        onResize: () => Term.remeasure(),
      }),
      cortex: () => WM.create({
        id: 'cortex',
        title: 'cortex',
        right: '<span id="cxstat"></span>',
        x: L.cortex.x, y: L.cortex.y, w: L.cortex.w, h: L.cortex.h,
        body: cortexWrap,
        onClose: () => { if (window.cortexInstance) window.cortexInstance.stop(); return true; },
      }),
    };

    for (const k of order) {
      if (k === 'term') termWin = make.term();
      else cortexWin = make.cortex();
    }

    if (WM.isTouch) {
      cortexWin.el.style.height = L.cortex.h + 'px';
      termWin.el.style.height = L.term.h + 'px';
    }

    /* Start the sphere once the window exists, so it measures a real box. */
    requestAnimationFrame(() => {
      try {
        const inst = Cortex.mount(cortexWrap, { seed: 42 });
        window.cortexInstance = inst;
        /* An open vault is a permanent change to the network. The #wave
         * hash previews that state without solving anything; it is a dev
         * switch like #fast and #preserve, not a shortcut anyone is told. */
        if ((Vault.open() || /wave/.test(location.hash)) && inst.entrain) inst.entrain();
        const stat = document.getElementById('cxstat');
        inst.onStats = s => {
          if (!stat) return;
          stat.textContent = s.backend === 'webgl'
            ? Math.round(s.fps) + ' fps · ' + s.n + ' cells · ' + s.rate.toFixed(1) + ' Hz'
              + (s.wave ? ' · θ wave' : '')
            : s.n + ' cells · ' + s.backend;
        };
      } catch (e) {
        cortexWin.body.innerHTML =
          '<div style="padding:16px;font-size:11px;color:#6b6b74;line-height:1.6">'
          + 'cortex unavailable on this device.<br>'
          + '<span style="color:#45454d">' + String(e.message || e) + '</span></div>';
      }
    });

    WM.focus(termWin);
  }

  /* ---- boot ----------------------------------------------------------------- */

  async function boot() {
    const prev = load();

    WM.init();
    openWindows();

    Term.init({
      onSubmit: cmd => Shell.execute(cmd),
      complete: (t, p) => Shell.complete(t, p),
    });

    Shell.ctx.root = Content.build();
    Shell.ctx.cwd = '/';
    Vault.init();
    /* If the vault was already open on an earlier visit, the network
     * carries the wave from the first frame. The mount callback checks the
     * same thing, because either of the two can run first. */
    if (Vault.open() && window.cortexInstance && window.cortexInstance.entrain) {
      window.cortexInstance.entrain();
    }
    if (window.SigmaMount) window.SigmaMount();
    updatePrompt();

    const fast = /fast/.test(location.hash) || state.visits > 3;
    const pause = fast ? 0 : 95;

    const narrowBoot = WM.isTouch || window.innerWidth < 560;
    const ok = (label, detail) =>
      Term.line({ html: '<span class="faint">' + label.padEnd(narrowBoot ? 12 : 18, ' ') + '</span>'
        + '<span class="dim">' + detail + '</span>' });

    const t0 = performance.now();
    let bytes = 0, files = 0, dirs = 0;
    Sys.walk(Shell.ctx.root, n => {
      if (n.type === 'dir') dirs++; else { files++; bytes += n.content.length; }
    });
    const inodes = Sys.countInodes(Shell.ctx.root);

    let blob = '';
    Sys.walk(Shell.ctx.root, n => { if (n.type === 'file') blob += n.content; });
    const sum = Sys.hex8(Sys.fnv1a(blob));

    /* An RS cell at I = 10 for one second is a known quantity. If the
     * arithmetic or the step scheme were wrong this count would move, so it
     * is worth checking out loud. */
    const probe = Neuro.simulate('RS', { ms: 1000, I: 10, onset: 0 });
    const rate = probe.spikes.length;
    const integratorOk = rate > 3 && rate < 40;

    const T = Content.TOPICS;
    const ids = Object.keys(T);
    let edges = 0, dangling = 0;
    for (const id of ids) {
      for (const l of (T[id].links || [])) { edges++; if (!T[l.to]) dangling++; }
    }
    const bootMs = performance.now() - t0;

    if (!fast) await Term.sleep(120);

    Term.line({ html: '<span class="label">DW-01 ' + VERSION + '</span>' });
    if (pause) await Term.sleep(pause);

    const narrow = narrowBoot;
    ok('filesystem', narrow
        ? inodes + ' inodes, ' + files + ' files, ' + Math.round(bytes / 1024) + ' KB'
        : inodes + ' inodes, ' + dirs + ' directories, ' + files
          + ' files, ' + bytes.toLocaleString() + ' bytes');
    if (pause) await Term.sleep(pause);

    ok('content', 'fnv1a ' + sum);
    if (pause) await Term.sleep(pause);

    ok('integrator', (narrow ? 'RS → ' : 'izhikevich RS, I=10, 1000 ms → ')
        + rate + ' spikes '
        + (integratorOk ? '<span class="ok">ok</span>' : '<span class="err">out of range</span>'));
    if (pause) await Term.sleep(pause);

    ok('topic graph', ids.length + ' nodes, ' + edges + ' edges'
        + (dangling ? ', <span class="err">' + dangling + ' dangling</span>'
                    : narrow ? ', linked' : ', no dangling references'));
    if (pause) await Term.sleep(pause);

    ok('cortex', Cortex.cellCount() + ' cells, running');
    if (pause) await Term.sleep(pause);

    ok('ready', bootMs.toFixed(1) + ' ms');
    Term.line('');

    if (pause) await Term.sleep(200);

    Term.line({ html: '<div class="display">Happy birthday, Max.</div>' });
    Term.line({ html: '<div class="display-sub">Dylan built you a computer. '
      + 'Everything in it runs.</div>' });
    Term.line('');
    /* The count has to be the real one: a phone runs 420, and the readout
     * two lines up already says so. */
    const cells = Cortex.cellCount();
    Term.line({ html: '<span class="dim">The ball is ' + (cells === 1000 ? 'a thousand' : cells)
      + ' Izhikevich neurons, live. The shell reads them. Somewhere in here are four locks.</span>' });
    Term.line('');

    if (state.visits > 1 && prev) {
      const ms = Date.now() - prev;
      const d = Math.floor(ms / 86400000), h = Math.floor(ms / 3600000);
      const ago = d >= 1 ? d + (d === 1 ? ' day' : ' days')
                : h >= 1 ? h + (h === 1 ? ' hour' : ' hours')
                : 'a few minutes';
      Term.line({ html: '<span class="faint">Visit ' + state.visits + '. Last one was '
        + ago + ' ago. The machine keeps its own count.</span>' });
      Term.line('');
    }

    if (Vault.count() > 0 && !Vault.open()) {
      Term.line({ html: '<span class="faint">Vault: ' + Vault.count() + ' of '
        + Vault.LOCKS.length + ' keys held.</span>' });
      Term.line('');
    }

    /* The two-column hint list wraps into mush on a phone, so narrow
     * screens get the commands without the descriptions. */
    Term.line({ html: narrow
      ? '<span class="dim">'
        + '<span class="b">cat /birthday</span> &nbsp;read the card<br>'
        + '<span class="b">help</span> &nbsp;<span class="b">tangent</span> &nbsp;'
        + '<span class="b">epee</span> &nbsp;<span class="b">vault</span><br>'
        + '<span class="b">neuro net</span></span>'
      : '<span class="dim">'
        + '<span class="b">cat /birthday</span>   read the card<br>'
        + '<span class="b">help</span>            everything this thing does<br>'
        + '<span class="b">tangent</span>         follow a thought<br>'
        + '<span class="b">neuro net</span>       the ball, plotted: raster and rhythm<br>'
        + '<span class="b">epee</span>            a scoring box that keeps real time<br>'
        + '<span class="b">vault</span>           the puzzle. four locks, four keys'
        + '</span>' });
    Term.line('');

    Term.showPrompt(true);
    Term.toBottom();

    /* Relayout on resize, but only for windows the user has not moved. Once
     * someone drags a window they own its position. */
    window.addEventListener('resize', () => {
      if (WM.isTouch) return;
      const L2 = layout();
      if (termWin && !termWin.moved) {
        WM.resize(termWin, L2.term.w, L2.term.h);
        WM.place(termWin, L2.term.x, L2.term.y);
      }
      if (cortexWin && !cortexWin.moved) {
        WM.resize(cortexWin, L2.cortex.w, L2.cortex.h);
        WM.place(cortexWin, L2.cortex.x, L2.cortex.y);
      }
    });
  }

  return { boot, updatePrompt, VERSION, get state() { return state; },
           get termWin() { return termWin; } };
})();

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => Main.boot());
} else {
  Main.boot();
}

</script>
</body>
</html>
